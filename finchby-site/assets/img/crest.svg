<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 98 320 416" role="img" aria-labelledby="ct">
  <title id="ct">Finchby arms: on a blue shield a gold chevron charged with three buckles between three gold roundels; framed by laurel branches, with a finch in flight above; motto Grip Fast</title>
  <defs>
    <!-- traditional engraver's hatching: horizontal lines = blue (azure), dots = gold (or) -->
    <pattern id="az" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 2.5 H5" stroke="#14261f" stroke-width=".8"/></pattern>
    <pattern id="or" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><circle cx="1.5" cy="1.5" r=".7" fill="#14261f"/><circle cx="4.5" cy="4.5" r=".7" fill="#14261f"/></pattern>
    <clipPath id="sh"><path d="M110 210 H290 V300 C290 360 250 400 200 425 C150 400 110 360 110 300 Z"/></clipPath>
    <g id="laurel" fill="#dfe8e2" stroke="#14261f" stroke-width="1.3" stroke-linejoin="round">
      <path d="M180.8 436.7 A138 138 0 0 1 102.8 202.1" fill="none" stroke-width="2"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(166.6 433.9) rotate(160.0) scale(1.00)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(166.6 433.9) rotate(228.0) scale(1.00)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(144.8 426.5) rotate(169.6) scale(0.97)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(144.8 426.5) rotate(237.6) scale(0.97)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(124.4 415.5) rotate(179.2) scale(0.95)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(124.4 415.5) rotate(247.2) scale(0.95)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(106.2 401.3) rotate(188.8) scale(0.93)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(106.2 401.3) rotate(256.8) scale(0.93)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(90.7 384.2) rotate(198.4) scale(0.90)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(90.7 384.2) rotate(266.4) scale(0.90)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(78.2 364.8) rotate(208.0) scale(0.88)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(78.2 364.8) rotate(276.0) scale(0.88)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(69.1 343.6) rotate(217.6) scale(0.85)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(69.1 343.6) rotate(285.6) scale(0.85)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(63.6 321.1) rotate(227.2) scale(0.82)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(63.6 321.1) rotate(295.2) scale(0.82)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(62.0 298.1) rotate(236.8) scale(0.80)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(62.0 298.1) rotate(304.8) scale(0.80)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(64.3 275.1) rotate(246.4) scale(0.78)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(64.3 275.1) rotate(314.4) scale(0.78)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(70.3 252.8) rotate(256.0) scale(0.75)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(70.3 252.8) rotate(324.0) scale(0.75)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(80.0 231.8) rotate(265.6) scale(0.72)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(80.0 231.8) rotate(333.6) scale(0.72)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(93.1 212.8) rotate(275.2) scale(0.70)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(93.1 212.8) rotate(343.2) scale(0.70)"/>
      <path d="M0 0 C7 -6 17 -6 25 0 C17 6 7 6 0 0 Z" transform="translate(102.8 202.1) rotate(315.2) scale(.7)"/>
    </g>
    <g id="buckle" fill="none" stroke="#14261f">
      <circle r="7" stroke-width="2.4" fill="#fff"/>
      <path d="M-7 0 H5" stroke-width="2"/>
    </g>
  </defs>

  <!-- laurel branches, both sides -->
  <use href="#laurel"/>
  <use href="#laurel" transform="translate(400 0) scale(-1 1)"/>
  <path d="M188 436 L212 444 M212 436 L188 444" stroke="#14261f" stroke-width="3" stroke-linecap="round"/>

  <!-- crest: finch in flight -->
  <g transform="translate(126 108) scale(.82)" fill="#14261f">
    <path d="M48 80 L8 82 L22 90 L10 101 L54 90 Z"/>
    <path d="M36 83 C58 66 96 56 124 58 C128 48 143 44 151 52 C154 55 155 58 155 61 L170 65 L155 70 C151 81 134 91 112 93 C84 95 58 91 36 83 Z"/>
    <path d="M122 60 C108 30 72 10 26 16 C52 24 70 42 80 70 C96 70 110 66 122 60 Z" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="145" cy="58" r="2.6" fill="#fff"/>
  </g>

  <!-- wreath (torse) -->
  <g stroke="#14261f" stroke-width="1.6" stroke-linejoin="round">
    <path d="M158 194 H242 V208 H158 Z" fill="#fff"/>
    <path d="M158 208 L166 194 H180 L172 208 Z M186 208 L194 194 H208 L200 208 Z M214 208 L222 194 H236 L228 208 Z" fill="#14261f"/>
  </g>

   <!-- shield -->
  <path d="M110 210 H290 V300 C290 360 250 400 200 425 C150 400 110 360 110 300 Z" fill="#fff"/>
  <g clip-path="url(#sh)">
    <rect x="100" y="200" width="200" height="240" fill="url(#az)"/>
    <path d="M200 258 L300 338 V374 L200 294 L100 374 V338 Z" fill="url(#or)" stroke="#14261f" stroke-width="2"/>
  </g>
  <path d="M110 210 H290 V300 C290 360 250 400 200 425 C150 400 110 360 110 300 Z" fill="none" stroke="#14261f" stroke-width="4" stroke-linejoin="round"/>
  <!-- three roundels (bezants), after Hope -->
  <g fill="url(#or)" stroke="#14261f" stroke-width="2">
    <circle cx="150" cy="243" r="15"/><circle cx="250" cy="243" r="15"/><circle cx="200" cy="366" r="15"/>
  </g>
  <!-- three buckles on the chevron, after Leslie -->
  <use href="#buckle" x="200" y="278"/>
  <use href="#buckle" transform="translate(156 314) rotate(-39)"/>
  <use href="#buckle" transform="translate(244 314) rotate(39)"/>

  <!-- motto scroll -->
  <g stroke="#14261f" stroke-width="2" stroke-linejoin="round">
    <path d="M92 462 L64 450 L74 470 L62 486 L92 492 Z M308 462 L336 450 L326 470 L338 486 L308 492 Z" fill="#dfe8e2"/>
    <path d="M92 462 L104 474 L104 502 L92 492 Z M308 462 L296 474 L296 502 L308 492 Z" fill="#14261f"/>
    <path d="M104 452 C160 470 240 470 296 452 L296 484 C240 502 160 502 104 484 Z" fill="#fff"/>
  </g>
  <path id="mp" d="M112 478 C164 494 236 494 288 478" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="5" fill="#14261f" text-anchor="middle">
    <textPath href="#mp" startOffset="50%">GRIP FAST</textPath>
  </text>
</svg>
